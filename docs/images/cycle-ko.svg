<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 192" role="img" aria-labelledby="cycle-ko-title cycle-ko-desc" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif">
  <title id="cycle-ko-title">한 번 깨어날 때</title>
  <desc id="cycle-ko-desc">깨어나서 측정하고, 서버에 보고하며 날씨를 받고, 화면을 갱신하고, 새 펌웨어가 있으면 FW 업데이트한 뒤 30분 동안 딥슬립하는 순환.</desc>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="1.5" y="1.5" width="909" height="189" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="150" y1="64" x2="168" y2="64" marker-end="url(#ah)"/>
    <line x1="298" y1="64" x2="316" y2="64" marker-end="url(#ah)"/>
    <line x1="446" y1="64" x2="464" y2="64" marker-end="url(#ah)"/>
    <line x1="594" y1="64" x2="612" y2="64" marker-end="url(#ah)"/>
    <line x1="742" y1="64" x2="760" y2="64" marker-end="url(#ah)"/>
    <path d="M826,99 V132 Q826,140 818,140 H94 Q86,140 86,132 V100" marker-end="url(#ah)"/>
  </g>
  <rect x="356" y="152" width="200" height="22" fill="#ffffff"/>
  <text x="456" y="168" text-anchor="middle" font-size="13" fill="#4b5563">30분 뒤, 리셋으로 처음부터</text>

  <rect x="24" y="32" width="124" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="86" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">깨어남</text>
  <text x="86" y="80" text-anchor="middle" font-size="12.5" fill="#4b5563">30분마다</text>

  <rect x="172" y="32" width="124" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="234" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">측정</text>
  <text x="234" y="80" text-anchor="middle" font-size="12.5" fill="#4b5563">배터리 · 온습도</text>

  <rect x="320" y="32" width="124" height="64" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="382" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#134e4a">서버 통신</text>
  <text x="382" y="80" text-anchor="middle" font-size="12.5" fill="#4b5563">보고 · 날씨 수신</text>

  <rect x="468" y="32" width="124" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="530" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">화면 갱신</text>
  <text x="530" y="80" text-anchor="middle" font-size="12.5" fill="#4b5563">e-Paper</text>

  <rect x="616" y="32" width="124" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="678" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">FW 업데이트</text>
  <text x="678" y="80" text-anchor="middle" font-size="12.5" fill="#4b5563">새 버전 있을 때만</text>

  <rect x="764" y="32" width="124" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="826" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">딥슬립</text>
  <text x="826" y="80" text-anchor="middle" font-size="12.5" fill="#4b5563">화면은 그대로</text>
</svg>
