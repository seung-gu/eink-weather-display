<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 574" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="1180" height="574" fill="#ffffff"/>
<text x="590" y="32" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">Where the switch goes</text>
<text x="590" y="56" font-size="13.5" fill="#64748b" text-anchor="middle">The MOSFET decides nothing. It is opened and closed by one GPIO.</text>

<!-- ===== battery: long thin plate = +, short thick = − (plate length carries polarity) ===== -->
<text x="98" y="106" font-size="13" fill="#0f172a" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">battery</text>
<path d="M98 138.8 V118" stroke="#c2410c" stroke-width="2.5" fill="none"/>
<path d="M98 153 V183" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M48 140 H148" stroke="#334155" stroke-width="2.5" fill="none"/>
<path d="M80 149 H116" stroke="#334155" stroke-width="8" fill="none"/>
<path d="M74 183 H122" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M82 191 H114" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M90 199 H106" stroke="#475569" stroke-width="2" fill="none"/>

<!-- ===== battery + rail (live whether the switch is open or closed) ===== -->
<path d="M98 118 H536" stroke="#c2410c" stroke-width="2.5" fill="none"/>
<text x="196" y="106" font-size="12.5" fill="#9a3412" font-family="ui-monospace,Menlo,monospace">battery +</text>
<circle cx="252" cy="118" r="5.5" fill="#c2410c"/>
<circle cx="412" cy="118" r="5.5" fill="#c2410c"/>

<!-- ===== sense divider, on the battery side ===== -->
<path d="M252 118 V176" stroke="#c2410c" stroke-width="2.5" fill="none"/>
<rect x="232" y="176" width="40" height="52" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="284" y="208" font-size="12.5" fill="#334155" font-family="ui-monospace,Menlo,monospace">1 MΩ</text>
<path d="M252 228 V266" stroke="#475569" stroke-width="2" fill="none"/>
<circle cx="252" cy="266" r="5.5" fill="#475569"/>
<path d="M252 266 H340" stroke="#475569" stroke-width="2" fill="none"/>
<circle cx="344" cy="266" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="354" y="271" font-size="13" fill="#334155" font-family="ui-monospace,Menlo,monospace">ADC</text>
<path d="M252 266 V304" stroke="#475569" stroke-width="2" fill="none"/>
<rect x="232" y="304" width="40" height="52" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="284" y="336" font-size="12.5" fill="#334155" font-family="ui-monospace,Menlo,monospace">1 MΩ</text>
<path d="M252 356 V386" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M228 386 H276" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M236 394 H268" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M244 402 H260" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M212 276 L245 267" stroke="#9a3412" stroke-width="1.2" fill="none"/>
<text x="106" y="280" font-size="12.5" fill="#9a3412" font-family="ui-monospace,Menlo,monospace">tapped on the</text>
<text x="106" y="298" font-size="12.5" fill="#9a3412" font-family="ui-monospace,Menlo,monospace">battery side</text>

<!-- ===== pull-up: gate back to the source rail ===== -->
<path d="M412 118 V176" stroke="#c2410c" stroke-width="2.5" fill="none"/>
<rect x="392" y="176" width="40" height="52" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="444" y="202" font-size="12.5" fill="#334155" font-family="ui-monospace,Menlo,monospace">1 MΩ</text>
<text x="444" y="220" font-size="11.5" fill="#475569" font-family="ui-monospace,Menlo,monospace">pull-up</text>
<path d="M412 228 V320" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M412 320 H592" stroke="#475569" stroke-width="2" fill="none"/>

<!-- ===== P-MOSFET ===== -->
<rect x="536" y="88" width="128" height="60" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="600" y="124" font-size="14" fill="#0f172a" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">P-MOSFET</text>
<text x="522" y="112" font-size="12.5" fill="#475569" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">S</text>
<text x="678" y="112" font-size="12.5" fill="#475569" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">D</text>
<text x="606" y="163" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,monospace">G</text>
<path d="M592 148 V320" stroke="#475569" stroke-width="2" fill="none"/>
<circle cx="592" cy="320" r="5.5" fill="#475569"/>

<!-- ===== board BAT+ : a different net, dies when the switch opens ===== -->
<path d="M664 118 H784" stroke="#1d4ed8" stroke-width="2.5" fill="none"/>
<text x="700" y="106" font-size="12.5" fill="#1e40af" font-family="ui-monospace,Menlo,monospace">board BAT+</text>

<!-- ===== N-MOSFET ===== -->
<path d="M592 320 V362" stroke="#475569" stroke-width="2" fill="none"/>
<rect x="536" y="362" width="112" height="56" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="592" y="396" font-size="14" fill="#0f172a" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">N-MOSFET</text>
<text x="606" y="356" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,monospace">D</text>
<text x="606" y="434" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,monospace">S</text>
<text x="656" y="384" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,monospace">G</text>
<path d="M592 418 V448" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M568 448 H616" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M576 456 H608" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M584 464 H600" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M648 390 H692" stroke="#475569" stroke-width="2" fill="none"/>
<rect x="692" y="368" width="56" height="44" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
<text x="720" y="395" font-size="12" fill="#334155" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">10 kΩ</text>
<path d="M748 390 H1041" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M1041 390 V152" stroke="#475569" stroke-width="2" fill="none"/>
<text x="880" y="382" font-size="12.5" fill="#475569" font-family="ui-monospace,Menlo,monospace">GPIO</text>

<!-- ===== board ===== -->
<rect x="784" y="88" width="150" height="60" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
<text x="859" y="124" font-size="14" fill="#0f172a" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">3.3 V LDO</text>
<path d="M934 118 H988" stroke="#475569" stroke-width="2.5" fill="none"/>
<text x="961" y="106" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">3.3 V</text>
<rect x="988" y="88" width="106" height="60" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
<text x="1041" y="124" font-size="14" fill="#0f172a" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">MCU</text>
<circle cx="1041" cy="148" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>

<!-- ===== board return ===== -->
<path d="M900 148 V178" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M876 178 H924" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M884 186 H916" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M892 194 H908" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M1070 148 V178" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M1046 178 H1094" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M1054 186 H1086" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M1062 194 H1078" stroke="#475569" stroke-width="2" fill="none"/>

<!-- ===== USB rail ===== -->
<path d="M784 232 H859" stroke="#16a34a" stroke-width="2.5" fill="none"/>
<path d="M859 232 V166" stroke="#16a34a" stroke-width="2.5" fill="none"/>
<path d="M859 148 L851 168 L867 168 Z" fill="#16a34a"/>
<text x="776" y="237" font-size="12.5" fill="#15803d" text-anchor="end" font-family="ui-monospace,Menlo,monospace">USB 5 V</text>

<!-- ===== role cards ===== -->
<rect x="40" y="486" width="356" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="60" y="510" font-size="12" fill="#334155" font-weight="700" letter-spacing="0.6" font-family="ui-monospace,Menlo,monospace">MEASURE</text>
<text x="60" y="534" font-size="13" fill="#475569">The divider and ADC already read the battery.</text>

<rect x="412" y="486" width="356" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="432" y="510" font-size="12" fill="#334155" font-weight="700" letter-spacing="0.6" font-family="ui-monospace,Menlo,monospace">DECIDE</text>
<text x="432" y="534" font-size="13" fill="#475569">Firmware compares it against a #define.</text>

<rect x="784" y="486" width="356" height="66" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="804" y="510" font-size="12" fill="#334155" font-weight="700" letter-spacing="0.6" font-family="ui-monospace,Menlo,monospace">DISCONNECT</text>
<text x="804" y="534" font-size="13" fill="#475569">The P-MOSFET opens the battery line.</text>
</svg>
