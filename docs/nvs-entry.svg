<text x="137.0" y="104.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">slot 0</text>
<text x="57.0" y="121.0" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">namespace table: "weather" = 7</text>
<rect x="45.0" y="138.0" width="430.0" height="46.0" rx="5" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
