<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="1180" height="400" fill="#ffffff"/>
<text x="590.0" y="32.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">One key-value pair, slot by slot</text>
<text x="45.0" y="68.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">The entry slots — 32 B each</text>
<rect x="45.0" y="84.0" width="430.0" height="46.0" rx="5" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
