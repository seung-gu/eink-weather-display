<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">
<rect width="1180" height="430" fill="#ffffff"/>
<text x="590" y="30" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">Two ways debugging fails without saying so</text>
<text x="40" y="64" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">① Is the app actually running?</text>
<rect x="40" y="74" width="1100" height="66" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="58" y="98" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">Normal boot</text>
<text x="210" y="98" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">boot:0x8 (SPI_FAST_FLASH_BOOT)</text>
<text x="210" y="118" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">the app runs</text>
<text x="1122" y="98" font-size="14" fill="#16a34a" text-anchor="end" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">✓</text>
<text x="1122" y="118" font-size="10" fill="#16a34a" text-anchor="end" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">breakpoints hit</text>
<rect x="40" y="148" width="1100" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="58" y="172" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">Download mode</text>
<text x="210" y="172" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">boot:0x0 (USB_BOOT) + wait usb download</text>
<text x="210" y="192" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">the app never starts — the CPU sits in ROM</text>
<text x="1122" y="172" font-size="14" fill="#dc2626" text-anchor="end" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">✕</text>
<text x="1122" y="192" font-size="10" fill="#dc2626" text-anchor="end" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">nothing can ever hit</text>
<text x="40" y="240" font-size="12.5" fill="#334155" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">② Did the reset go through the debugger?</text>
<rect x="40" y="250" width="1100" height="66" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="58" y="274" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">Debugger reset</text>
<text x="210" y="274" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">Restart  ·  monitor reset halt  ·  PIO Debug (without uploading)</text>
<text x="210" y="294" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">GDB re-plants the hardware breakpoints</text>
<text x="1122" y="274" font-size="14" fill="#16a34a" text-anchor="end" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">✓</text>
<text x="1122" y="294" font-size="10" fill="#16a34a" text-anchor="end" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">breakpoints hit</text>
<rect x="40" y="324" width="1100" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="58" y="348" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">Reset button</text>
<text x="210" y="348" font-size="10.5" fill="#334155" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">the chip resets behind GDB's back</text>
<text x="210" y="368" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">trigger registers are cleared, nothing re-plants them</text>
<text x="1122" y="348" font-size="14" fill="#dc2626" text-anchor="end" font-weight="700" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">✕</text>
<text x="1122" y="368" font-size="10" fill="#dc2626" text-anchor="end" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">never stops again</text>
<text x="40" y="426" font-size="11" fill="#475569" text-anchor="start" font-weight="400" font-family="-apple-system,'Segoe UI',Roboto,Arial,sans-serif">Both look identical from the editor: the session connects, the breakpoint shows a red dot, and execution simply never stops.</text>
</svg>