; Shared by every env
[env]
extends = dbg                 ; 파일 맨 뒤 [dbg] 섹션의 디버그 설정 상속
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I src/common          ; shared headers (config.h, net.h, secrets.h)
lib_deps =
    zinggjm/GxEPD2@^1.5.0
    olikraus/U8g2_for_Adafruit_GFX

; ── program dimension (which src/ folder to build) ──
[prog_weather]
build_src_filter = +<common/> +<weather/>

[prog_led]
build_src_filter = +<common/> +<led/>

; ── program × board ──
[env:weather-xiao]
extends = prog_weather
board = seeed_xiao_esp32c3

[env:weather-supermini]
extends = prog_weather
board = esp32-c3-devkitm-1

[env:led-supermini]
extends = prog_led
board = esp32-c3-devkitm-1

; ── 디버그 설정 (전 env가 [env] 통해 상속) ──
[dbg]
debug_tool = esp-builtin          ; C3 내장 USB-JTAG (외부 프로브 불필요)
debug_init_break = tbreak setup   ; setup() 진입에서 멈춤
debug_build_flags = -Og -g2 -DDEBUG_NO_SLEEP   ; 디버그 빌드에서만: 심볼 + 딥슬립 자동 비활성화
; RTOS 인식 끄기 + flash-probe 우회 + 하드웨어 브레이크포인트 강제 (앱 실행 중 디버그 가능)
debug_server =
    ${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd-esp32
    -c
    gdb_port pipe; tcl_port disabled; telnet_port disabled
    -s
    ${platformio.packages_dir}/tool-openocd-esp32/share/openocd/scripts
    -f
    interface/esp_usb_jtag.cfg
    -c
    set ESP_RTOS none
    -f
    target/esp32c3.cfg
    -c
    adapter speed 5000
    -c
    gdb_memory_map disable
    -c
    gdb_breakpoint_override hard
