; Shared by every env
[env]
extends = dbg                 ; debug settings from the [dbg] section at the end of this file
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I src/common          ; shared headers (config.h, net.h, secrets.h)
lib_deps =
    zinggjm/GxEPD2@^1.5.0
    olikraus/U8g2_for_Adafruit_GFX

; ── program dimension (which src/ folder to build) ──
[prog_weather]
build_src_filter = +<common/> +<weather/>

[prog_led]
build_src_filter = +<common/> +<led/>

; ── program × board ──
[env:weather-xiao]
extends = prog_weather
board = seeed_xiao_esp32c3

[env:weather-supermini]
extends = prog_weather
board = esp32-c3-devkitm-1

[env:led-supermini]
extends = prog_led
board = esp32-c3-devkitm-1

; ── debug settings, inherited by every env through [env] ──
[dbg]
debug_tool = esp-builtin          ; the C3's built-in USB-JTAG; no external probe
debug_init_break = tbreak setup   ; stop on entry to setup()
debug_build_flags = -Og -g2 -DDEBUG_NO_SLEEP   ; debug builds only: symbols, and no deep sleep
; no RTOS awareness, no flash probe on attach, hardware breakpoints — see docs/jtag-debug.md
debug_server =
    ${platformio.packages_dir}/tool-openocd-esp32/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd-esp32
    -c
    gdb_port pipe; tcl_port disabled; telnet_port disabled
    -s
    ${platformio.packages_dir}/tool-openocd-esp32/share/openocd/scripts
    -f
    interface/esp_usb_jtag.cfg
    -c
    set ESP_RTOS none
    -f
    target/esp32c3.cfg
    -c
    adapter speed 5000
    -c
    gdb_memory_map disable
    -c
    gdb_breakpoint_override hard
