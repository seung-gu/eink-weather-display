[platformio]
default_envs = weather-supermini      ; `-e` 없이 실행하면 이 env만 (아래에서 -e로 개별 지정 가능)

; Shared by every env
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I src/common          ; shared headers (config.h, net.h, secrets.h)
lib_deps =
    zinggjm/GxEPD2@^1.5.0
    olikraus/U8g2_for_Adafruit_GFX

; ── program dimension (which src/ folder to build) ──
[prog_weather]
build_src_filter = +<common/> +<weather/>

[prog_led]
build_src_filter = +<common/> +<led/>

; ── program × board ──
[env:weather-xiao]
extends = prog_weather
board = seeed_xiao_esp32c3

[env:weather-supermini]
extends = prog_weather
board = esp32-c3-devkitm-1

[env:led-supermini]
extends = prog_led
board = esp32-c3-devkitm-1
