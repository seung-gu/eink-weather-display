[env:esp32-c3-super-mini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; ESP32-C3 Super Mini는 네이티브 USB(USB Serial/JTAG)를 사용합니다.
; Serial 출력을 USB로 보려면 아래 CDC 옵션이 필요합니다.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; e-Paper (Waveshare 1.54" 흑백) 드라이버 + 그래픽 라이브러리
; GxEPD2가 Adafruit GFX / Adafruit BusIO를 자동으로 함께 설치합니다.
lib_deps =
    zinggjm/GxEPD2@^1.5.0
    olikraus/U8g2_for_Adafruit_GFX
